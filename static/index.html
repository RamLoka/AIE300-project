<!DOCTYPE html>
<html>
<head>
    <title>Item Manager</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { margin: 5px; }
        button { margin-left: 5px; }
        .item { padding: 10px; border-bottom: 1px solid #ddd; }

        #chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .assistant {
            text-align: left;
            margin: 10px;
        }

        .bubble {
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }

        .user .bubble {
            background: #d1e7ff;
        }

        .assistant .bubble {
            background: #eeeeee;
        }

        #loading {
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>Item Manager</h1>

    <h3>Create Item</h3>
    <input id="name" placeholder="Name">
    <input id="description" placeholder="Description">
    <button onclick="createItem()">Create</button>

    <h3>Items</h3>
    <div id="items"></div>

    <h3>Iris Prediction</h3>
    
    <input id="f1" placeholder="Sepal Length">
    <input id="f2" placeholder="Sepal Width">
    <input id="f3" placeholder="Petal Length">
    <input id="f4" placeholder="Petal Width">

    <button onclick="predict()">Predict</button>

    <p id="result"></p>

    <h3>AI Chat Assistant</h3>

    <div id="chat-box"></div>

    <div id="loading">AI is thinking...</div>

    <input
        type="text"
        id="message-input"
        placeholder="Type a message..."
        style="width:80%;"
    />

    <button onclick="sendMessage()">Send</button>

<script>
const API = "http://localhost:8000";

let conversationHistory = [];

async function loadItems() {
    const res = await fetch(`${API}/items`);
    const data = await res.json();

    const container = document.getElementById("items");
    container.innerHTML = "";

    data.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";

    div.innerHTML = `
        <b>${item.name}</b> - ${item.description || ""}
        <button onclick="deleteItem('${item.id}')">Delete</button>
        <button onclick="editItem('${item.id}')">Edit</button>
    `;

        container.appendChild(div);
    });
}

async function createItem() {
    const name = document.getElementById("name").value;
    const description = document.getElementById("description").value;

    await fetch(`${API}/items`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ name, description })
    });

    loadItems();
}

async function deleteItem(id) {
    await fetch(`${API}/items/${id}`, { method: "DELETE" });
    loadItems();
}

async function editItem(id) {
    const newName = prompt("New name:");
    const newDesc = prompt("New description:");

    await fetch(`${API}/items/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ name: newName, description: newDesc })
    });

    loadItems();
}

async function predict() {

    const features = [
        parseFloat(document.getElementById("f1").value),
        parseFloat(document.getElementById("f2").value),
        parseFloat(document.getElementById("f3").value),
        parseFloat(document.getElementById("f4").value)
    ];

    const response = await fetch(`${API}/predict`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ features })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        `Prediction: ${data.prediction}, Confidence: ${data.confidence}`;
}

async function sendMessage() {

    const input = document.getElementById("message-input");
    const message = input.value.trim();

    if (!message) return;

    addMessage("user", message);

    input.value = "";

    document.getElementById("loading").style.display = "block";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    conversation_history: conversationHistory
                })
            }
        );

        const data = await response.json();

        addMessage("assistant", data.reply);

        conversationHistory = data.conversation_history;

    } catch (error) {

        addMessage(
            "assistant",
            "Error connecting to backend."
        );

    }

    document.getElementById("loading").style.display = "none";
}

function addMessage(role, text) {

    const chatBox = document.getElementById("chat-box");

    const messageDiv = document.createElement("div");

    messageDiv.className = role;

    messageDiv.innerHTML =
        `<div class="bubble">${text}</div>`;

    chatBox.appendChild(messageDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
}

loadItems();
</script>

</body>
</html>
